# Confronts wapiti's NTLM authentication with a real IIS server using Windows Authentication.
name: NTLM against IIS
on: [push, pull_request]

jobs:
  ntlm-iis:
    runs-on: windows-2022
    env:
      # The runner console is cp1252: wapiti's output must not depend on it
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Generate a throwaway password for the test account
        shell: pwsh
        run: |
          $password = "Aa1!" + [guid]::NewGuid().ToString("N")
          "::add-mask::$password"
          "NTLM_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install IIS with Windows Authentication
        shell: pwsh
        run: |
          Install-WindowsFeature Web-Server, Web-Windows-Auth | Out-Host
          $password = ConvertTo-SecureString $env:NTLM_PASSWORD -AsPlainText -Force
          New-LocalUser -Name alice -Password $password -PasswordNeverExpires | Out-Host
          $appcmd = "$env:windir\system32\inetsrv\appcmd.exe"
          & $appcmd set config "Default Web Site" -section:system.webServer/security/authentication/anonymousAuthentication /enabled:false /commit:apphost
          & $appcmd set config "Default Web Site" -section:system.webServer/security/authentication/windowsAuthentication /enabled:true /commit:apphost

      - name: Install wapiti
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: NTLM with the default providers (Negotiate, NTLM)
        shell: pwsh
        run: python .github/scripts/ntlm_iis_check.py http://localhost/ "$env:COMPUTERNAME\alice" $env:NTLM_PASSWORD

      - name: Wapiti scan through NTLM
        shell: pwsh
        run: |
          wapiti -u http://localhost/ --auth-user "$env:COMPUTERNAME\alice" --auth-password $env:NTLM_PASSWORD --auth-method ntlm -m "" --flush-session -v 2 -f json -o report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check that IIS served the scan as the test account
        shell: pwsh
        run: |
          netsh http flush logbuffer | Out-Null
          Start-Sleep -Seconds 2
          # The scan uses wapiti's default (Firefox) User-Agent, the check script its own
          $authenticated = Get-Content C:\inetpub\logs\LogFiles\W3SVC1\*.log |
            Where-Object { $_ -match "\\alice " -and $_ -match "Firefox" -and $_ -match " 200 " }
          if (-not $authenticated) { Write-Error "No request of the wapiti scan was authenticated by IIS"; exit 1 }
          "$(@($authenticated).Count) request(s) of the wapiti scan authenticated by IIS"

      - name: Restrict IIS to the Negotiate provider
        shell: pwsh
        run: |
          $appcmd = "$env:windir\system32\inetsrv\appcmd.exe"
          & $appcmd set config "Default Web Site" -section:system.webServer/security/authentication/windowsAuthentication /-"providers.[value='NTLM']" /commit:apphost

      - name: NTLM token under the Negotiate scheme
        shell: pwsh
        run: python .github/scripts/ntlm_iis_check.py http://localhost/ "$env:COMPUTERNAME\alice" $env:NTLM_PASSWORD

      - name: IIS logs
        if: failure()
        shell: pwsh
        run: |
          netsh http flush logbuffer | Out-Null
          Start-Sleep -Seconds 2
          Get-Content C:\inetpub\logs\LogFiles\W3SVC1\*.log -ErrorAction SilentlyContinue
